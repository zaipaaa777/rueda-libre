<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>

    <link href="src/output.css" rel="stylesheet">
</head>

<body>

<main class="min-h-screen bg-slate-950 text-slate-100">

    <section class="mx-auto w-full max-w-2xl space-y-6 px-6 py-20 text-center">

        <p class="text-sm font-semibold uppercase tracking-widest text-amber-400">
            Nuevo · Jueves a sábado
        </p>

        <h1 class=" text-5xl font-bold tracking-tight text-white">

        <p class="mx-auto max-w-md text-lg leading-relaxed text-slate-300">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="space-y-3">
            <li>
                <span class="text-4xl font-bold text-white">3</span>
                <span class="text-sm uppercase tracking-wide text-slate-400">rutas</span>
            </li>
            <li>
                <span class="text-sm uppercase tracking-wide text-slate-400">Desde</span>
                <span class="text-4xl font-bold text-white">$55.000</span>
            </li>
        </ul>

        <a href="#"
           class="inline-block rounded-full bg-amber-400 px-8 py-3 text-base font-semibold text-slate-950 transition hover:bg-amber-300 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
            Inscríbete
        </a>

    </section>

        <section class="mx-auto w-full max-w-2xl space-y-6 px-6 pb-20 text-center">

        <h2 class="text-2xl font-bold text-white">Botones</h2>

        <div class="flex flex-wrap items-center justify-center gap-4">

            <button type="button"
                    class="rounded-full bg-amber-400 px-8 py-3 font-semibold text-slate-950 shadow-lg shadow-amber-400/20 transition hover:bg-amber-300 focus:outline-hidden focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                Inscríbete
            </button>

            <button type="button"
                    class="rounded-full bg-slate-800 px-8 py-3 font-semibold text-slate-100 shadow-lg transition hover:bg-slate-700 focus:outline-hidden focus:ring-4 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                Ver rutas
            </button>

            <button type="button"
                    class="rounded-full border-2 border-amber-400 px-8 py-3 font-semibold text-amber-400 transition hover:bg-amber-400 hover:text-slate-950 focus:outline-hidden focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                Más información
            </button>

        </div>

    </section>

</main>

</body>
</html>
